name: Publish to Visual Studio Marketplace

on:
  workflow_dispatch:
    inputs:
      mode:
        description: Publish the latest release, or check Microsoft identity
        type: choice
        required: true
        default: publish
        options:
          - publish
          - check-auth

permissions:
  contents: read

concurrency:
  group: publish-visual-studio-marketplace
  cancel-in-progress: false

jobs:
  publish:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write
    defaults:
      run:
        shell: bash
    env:
      VSIX: sops-safe.vsix
    steps:
      - name: Check out publishing action
        if: inputs.mode == 'publish'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Node.js
        if: inputs.mode == 'publish'
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: '24'
          package-manager-cache: false

      - name: Download and validate latest release
        if: inputs.mode == 'publish'
        uses: ./.github/actions/download-release
        with:
          path: ${{ env.VSIX }}

      - name: Check Microsoft Entra configuration
        env:
          AZURE_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
          AZURE_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
        run: |
          if [[ -z "$AZURE_CLIENT_ID" || -z "$AZURE_TENANT_ID" ]]; then
            echo 'Set the AZURE_CLIENT_ID and AZURE_TENANT_ID Actions variables for the federated publishing identity.' >&2
            exit 1
          fi

      - name: Sign in to Microsoft Entra through GitHub OIDC
        uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3.1.0
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          allow-no-subscriptions: true

      - name: Show Marketplace member ID
        if: inputs.mode == 'check-auth'
        run: |
          profile_id=$(az rest \
            --url https://app.vssps.visualstudio.com/_apis/profile/profiles/me \
            --resource 499b84ac-1321-427f-aa17-267ca6975798 \
            --query id --output tsv)
          if [[ -z "$profile_id" || "$profile_id" == "null" ]]; then
            echo 'Microsoft did not return a Marketplace member ID.' >&2
            exit 1
          fi
          printf 'Marketplace member ID: %s\n' "$profile_id"
          printf 'Marketplace member ID: %s\n\nAdd this ID to publisher **jgus** with the **Contributor** role. This check does not verify publisher permissions.\n' "$profile_id" >> "$GITHUB_STEP_SUMMARY"

      - name: Publish to Visual Studio Marketplace
        if: inputs.mode == 'publish'
        run: |
          npx --yes --ignore-scripts --package=@vscode/vsce@3.9.2 -- \
            vsce publish --azure-credential --packagePath "$VSIX" --skip-duplicate
