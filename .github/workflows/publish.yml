name: Publish latest release

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: publish-marketplaces
  cancel-in-progress: false

jobs:
  publish:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    defaults:
      run:
        shell: bash
    env:
      VSIX: sops-safe.vsix
    steps:
      - name: Install Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: '24'
          package-manager-cache: false

      - name: Download and validate latest release
        id: package
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          tag=$(gh api "repos/$GH_REPO/releases/latest" --jq '.tag_name')
          if [[ ! "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            printf 'Expected a stable vMAJOR.MINOR.PATCH release tag; received %s.\n' "$tag" >&2
            exit 1
          fi
          version=${tag#v}
          gh release download "$tag" --pattern "sops-safe-$version.vsix" --output "$VSIX"
          python3 - "$VSIX" "$version" <<'PY'
          import json
          import sys
          import xml.etree.ElementTree as ET
          import zipfile

          with zipfile.ZipFile(sys.argv[1]) as archive:
              package = json.loads(archive.read("extension/package.json"))
              manifest = ET.fromstring(archive.read("extension.vsixmanifest"))
          identity = manifest.find("{*}Metadata/{*}Identity")
          expected = ("jgus", "sops-safe", sys.argv[2])
          package_identity = tuple(package.get(key) for key in ("publisher", "name", "version"))
          vsix_identity = tuple(identity.get(key) for key in ("Publisher", "Id", "Version")) if identity is not None else None
          if package_identity != expected or vsix_identity != expected:
              sys.exit("Both VSIX manifests must identify jgus.sops-safe with the version from its release tag.")
          PY
          printf 'Publishing **jgus.sops-safe %s** from release **%s**.\n' "$version" "$tag" >> "$GITHUB_STEP_SUMMARY"

      - name: Publish to VS Code Marketplace
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
        run: |
          if [[ -z "$VSCE_PAT" ]]; then
            echo 'Set the VSCE_PAT Actions secret before publishing to VS Code Marketplace.' >&2
            exit 1
          fi
          npx --yes --ignore-scripts --package=@vscode/vsce@3.9.2 -- \
            vsce publish --packagePath "$VSIX" --skip-duplicate

      - name: Publish to Open VSX
        if: ${{ !cancelled() && steps.package.outcome == 'success' }}
        env:
          OVSX_PAT: ${{ secrets.OVSX_PAT }}
        run: |
          if [[ -z "$OVSX_PAT" ]]; then
            echo 'Set the OVSX_PAT Actions secret before publishing to Open VSX.' >&2
            exit 1
          fi
          npx --yes --ignore-scripts --package=ovsx@1.2.0 -- \
            ovsx publish "$VSIX" --skip-duplicate
