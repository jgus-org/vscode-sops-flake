name: Publish latest release

on:
  workflow_dispatch:
    inputs:
      mode:
        description: Check Microsoft identity, or publish the latest release
        type: choice
        required: true
        default: check-auth
        options:
          - check-auth
          - publish

permissions:
  contents: read

concurrency:
  group: publish-marketplaces
  cancel-in-progress: false

jobs:
  publish:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write
    defaults:
      run:
        shell: bash
    env:
      VSIX: sops-safe.vsix
    steps:
      - name: Install Node.js
        if: inputs.mode == 'publish'
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: '24'
          package-manager-cache: false

      - name: Download and validate latest release
        if: inputs.mode == 'publish'
        id: package
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          tag=$(gh api "repos/$GH_REPO/releases/latest" --jq '.tag_name')
          if [[ ! "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            printf 'Expected a stable vMAJOR.MINOR.PATCH release tag; received %s.\n' "$tag" >&2
            exit 1
          fi
          version=${tag#v}
          gh release download "$tag" --pattern "sops-safe-$version.vsix" --output "$VSIX"
          python3 - "$VSIX" "$version" <<'PY'
          import json
          import sys
          import xml.etree.ElementTree as ET
          import zipfile

          with zipfile.ZipFile(sys.argv[1]) as archive:
              package = json.loads(archive.read("extension/package.json"))
              manifest = ET.fromstring(archive.read("extension.vsixmanifest"))
          identity = manifest.find("{*}Metadata/{*}Identity")
          expected = ("jgus", "sops-safe", sys.argv[2])
          package_identity = tuple(package.get(key) for key in ("publisher", "name", "version"))
          vsix_identity = tuple(identity.get(key) for key in ("Publisher", "Id", "Version")) if identity is not None else None
          if package_identity != expected or vsix_identity != expected:
              sys.exit("Both VSIX manifests must identify jgus.sops-safe with the version from its release tag.")
          PY
          printf 'Publishing **jgus.sops-safe %s** from release **%s**.\n' "$version" "$tag" >> "$GITHUB_STEP_SUMMARY"

      - name: Check Microsoft Entra configuration
        env:
          AZURE_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
          AZURE_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
        run: |
          if [[ -z "$AZURE_CLIENT_ID" || -z "$AZURE_TENANT_ID" ]]; then
            echo 'Set the AZURE_CLIENT_ID and AZURE_TENANT_ID Actions variables for the federated publishing identity.' >&2
            exit 1
          fi

      - name: Sign in to Microsoft Entra through GitHub OIDC
        uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3.1.0
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          allow-no-subscriptions: true

      - name: Show Marketplace member ID
        if: inputs.mode == 'check-auth'
        run: |
          profile_id=$(az rest \
            --url https://app.vssps.visualstudio.com/_apis/profile/profiles/me \
            --resource 499b84ac-1321-427f-aa17-267ca6975798 \
            --query id --output tsv)
          if [[ -z "$profile_id" || "$profile_id" == "null" ]]; then
            echo 'Microsoft did not return a Marketplace member ID.' >&2
            exit 1
          fi
          printf 'Marketplace member ID: %s\n' "$profile_id"
          printf 'Marketplace member ID: %s\n\nAdd this ID to publisher **jgus** with the **Contributor** role. This check does not verify publisher permissions.\n' "$profile_id" >> "$GITHUB_STEP_SUMMARY"

      - name: Publish to VS Code Marketplace
        if: inputs.mode == 'publish'
        run: |
          npx --yes --ignore-scripts --package=@vscode/vsce@3.9.2 -- \
            vsce publish --azure-credential --packagePath "$VSIX" --skip-duplicate

      - name: Publish to Open VSX
        if: ${{ !cancelled() && inputs.mode == 'publish' && steps.package.outcome == 'success' }}
        env:
          OVSX_PAT: ${{ secrets.OVSX_PAT }}
        run: |
          if [[ -z "$OVSX_PAT" ]]; then
            echo 'Set the OVSX_PAT Actions secret before publishing to Open VSX.' >&2
            exit 1
          fi
          npx --yes --ignore-scripts --package=ovsx@1.2.0 -- \
            ovsx publish "$VSIX" --skip-duplicate
