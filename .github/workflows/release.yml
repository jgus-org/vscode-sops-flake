name: Release VSIX

on:
  workflow_dispatch:
    inputs:
      version:
        description: Stable version to release (for example, 0.1.1)
        required: true
        type: string
  release:
    types: [published]

permissions:
  contents: write

concurrency:
  group: release-vsix
  cancel-in-progress: false

jobs:
  release:
    if: >-
      github.event_name == 'release' ||
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-24.04
    defaults:
      run:
        shell: bash
    env:
      RELEASE_TAG: ${{ github.event.release.tag_name }}
    steps:
      - name: Check out release commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && github.sha || format('refs/tags/{0}', github.event.release.tag_name) }}
          persist-credentials: false

      - name: Install Nix
        uses: cachix/install-nix-action@1ca7d21a94afc7c957383a2d217460d980de4934 # v31.10.1

      - name: Stamp version
        if: github.event_name == 'workflow_dispatch'
        env:
          VERSION: ${{ inputs.version }}
        run: nix run .#version-stamp --no-write-lock-file -- "$VERSION"

      - name: Validate release version
        id: version
        run: |
          package_version=$(jq -er '.version' package.json)
          if [[ ! "$package_version" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo 'Only stable MAJOR.MINOR.PATCH releases are supported.' >&2
            exit 1
          fi
          jq -e --arg version "$package_version" \
            '.version == $version and .packages[""].version == $version' package-lock.json > /dev/null
          tag="v$package_version"
          if [[ "$GITHUB_EVENT_NAME" == release && "$RELEASE_TAG" != "$tag" ]]; then
            printf 'Release tag must be %s; received %s.\n' "$tag" "$RELEASE_TAG" >&2
            exit 1
          fi
          printf 'version=%s\ntag=%s\n' "$package_version" "$tag" >> "$GITHUB_OUTPUT"

      - name: Check tag availability
        if: github.event_name == 'workflow_dispatch'
        env:
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          refs=$(git ls-remote origin "refs/tags/$TAG")
          if [[ -n "$refs" ]]; then
            echo "Tag $TAG already exists. Existing releases are never replaced by this action." >&2
            exit 1
          fi

      - name: Commit version
        if: github.event_name == 'workflow_dispatch'
        env:
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add package.json package-lock.json
          git commit -m "Release $TAG"

      - name: Build and test VSIX
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          nix build .#vsix --no-write-lock-file --out-link "$RUNNER_TEMP/sops-safe-vsix"
          cp "$RUNNER_TEMP/sops-safe-vsix" "sops-safe-$VERSION.vsix"

      # GITHUB_TOKEN-created releases do not trigger release.published workflows.
      # Build and attach the artifact here before publishing the GitHub release.
      - name: Create tag and GitHub release
        if: github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ steps.version.outputs.version }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          git tag "$TAG"
          gh auth setup-git
          # Refuse both updates if main advanced or the tag was created during the build.
          git push --atomic origin HEAD:refs/heads/main "refs/tags/$TAG"
          gh release create "$TAG" "sops-safe-$VERSION.vsix" \
            --verify-tag --title "v$VERSION" --generate-notes --latest
          printf 'Created %s. Run **Publish latest release** with mode **publish** to publish to both marketplaces.\n' \
            "$TAG" >> "$GITHUB_STEP_SUMMARY"

      - name: Attach VSIX to manually published release
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ steps.version.outputs.version }}
        run: gh release upload "$RELEASE_TAG" "sops-safe-$VERSION.vsix" --clobber
